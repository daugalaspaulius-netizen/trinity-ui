<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="EFM LEADS">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00ff41"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9ffe3"/>
      <stop offset="1" stop-color="#8affb0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Matrix rain columns background -->
  <g opacity="0.16" font-family="monospace" font-size="13" fill="#00ff41">
    <text x="12"  y="30">1</text><text x="12"  y="48">0</text><text x="12"  y="66">1</text>
    <text x="34"  y="24">0</text><text x="34"  y="42">1</text><text x="34"  y="60">0</text>
    <text x="56"  y="36">1</text><text x="56"  y="54">1</text>
    <text x="78"  y="20">0</text><text x="78"  y="38">1</text><text x="78"  y="56">0</text>
    <text x="100" y="30">1</text><text x="100" y="48">0</text>
    <text x="540" y="30">0</text><text x="540" y="48">1</text>
    <text x="562" y="24">1</text><text x="562" y="42">0</text>
    <text x="584" y="36">0</text><text x="584" y="54">1</text>
    <text x="606" y="20">1</text><text x="606" y="38">0</text><text x="606" y="56">1</text>
    <text x="628" y="30">0</text><text x="628" y="48">1</text>
  </g>

  <!-- Neon frame -->
  <rect x="2" y="2" width="636" height="196" rx="10" fill="none" stroke="#00ff41" stroke-width="2" filter="url(#softGlow)" opacity="0.55"/>
  <rect x="10" y="10" width="620" height="180" rx="6" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.35"/>

  <!-- Corner accents -->
  <path d="M2 30 L2 12 Q2 2 12 2 L30 2" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>
  <path d="M638 30 L638 12 Q638 2 628 2 L610 2" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>
  <path d="M2 170 L2 188 Q2 198 12 198 L30 198" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>
  <path d="M638 170 L638 188 Q638 198 628 198 L610 198" fill="none" stroke="#00ff41" stroke-width="3" filter="url(#glow)"/>

  <!-- EFM LEADS title -->
  <text x="320" y="86" text-anchor="middle" font-family="'Courier New', monospace" font-size="60" font-weight="bold"
        fill="url(#textGrad)" filter="url(#glow)" letter-spacing="4">EFM LEADS</text>

  <!-- Tagline -->
  <text x="320" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="600"
        fill="#00ff41" filter="url(#glow)" letter-spacing="10">AI • LEADS • CRM</text>

  <!-- Divider line -->
  <line x1="140" y1="146" x2="500" y2="146" stroke="url(#neon)" stroke-width="1.5" opacity="0.7"/>

  <!-- EFM badge -->
  <text x="320" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="600"
        fill="#00e5ff" letter-spacing="14" opacity="0.9">E F M</text>
</svg>
